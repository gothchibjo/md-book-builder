name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: ./scripts/test.sh

      - name: Build binaries
        run: ./scripts/build.sh

      - name: Checksums
        working-directory: dist
        run: sha256sum md-book-builder_* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/md-book-builder_* dist/SHA256SUMS --generate-notes
