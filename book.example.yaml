# Example book configuration.
#
# Copy this file to `book.yaml` next to the binary and adjust the paths.
# All relative paths are resolved against the directory of this file.
#
# A document is "external" when it is part of the knowledge base but not
# listed in `include`; links to external documents are rendered as plain
# text instead of clickable links.

title: "Knowledge Base — IT Department"
subtitle: "Tech docs collection"
kb_root: ../knowledge-base
out: build/knowledge-base.pdf

# Which heading levels appear in the table of contents:
#   [1]    documents only
#   [1, 2] documents and their second-level sections
toc_levels: [1, 2]

# Render the table of contents (default true). Set to false for single-
# document conversions.
# toc: true

# Render the title page (cover) with title and subtitle (default true). Set
# to false for single-document conversions.
# cover: true

# The sections of the book. Globs (patterns with * ? [ {) match documents
# directly. A plain directory entry (no mask, like docs/team/ below) declares
# a "link-root": documents in that directory are collected only when they are
# referenced by an internal link from an already-included document; the
# directory itself is never browsed. Documents appear in the book in the order
# of this list; within one pattern they are ordered by directory, README.md
# first in each directory.
include:
  - docs/engineering/**/*.md
  - docs/org/README.md
  - docs/services/README.md
  - docs/vendors/README.md
  - docs/team/README.md
  - docs/team/
  - docs/team/alice/README.md
  - docs/team/bob/README.md
  - docs/team/carol/README.md
  - docs/team/dave/README.md

# Optional: patterns excluded from the book, applied after include. Accepts
# files, masks and folders: "docs/team/alice/README.md", "docs/org/**",
# "docs/team/" or "docs/team/bob" (the .md suffix is optional).
# exclude:
#   - docs/team/bob

# When a link-root document is pulled in, keep following its internal links
# into other link-root directories transitively (default true). When false,
# only documents referenced directly by glob-matched documents are collected.
# transitive_links: true

# Optional: explicit Chrome/Chromium binary. When omitted the tool probes
# well-known install locations (env MD_BOOK_BUILDER_CHROME wins first).
# chrome_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

# Optional: footer language. Supported values: "en" (default) and "ru".
# locale: en
